<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password — TRUSCREN TECH HUB</title>
  <meta name="description" content="Reset the password for your TRUSCREN TECH HUB account.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --blaze:#FF6900;
      --aqua:#007A5E;
      --ebony:#262E3D;
      --ink:#1a1f29;
      --muted:#6b7280;
      --line:#e5e7eb;
      --bg:#f6f7f9;
      --card:#ffffff;
      --err:#b91c1c;
      --err-bg:#fef2f2;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      background:var(--bg);
      color:var(--ink);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    .shell{width:100%;max-width:430px}
    .brandline{
      display:flex;align-items:center;gap:8px;
      justify-content:center;margin-bottom:22px;
    }
    .brandline .dot{width:10px;height:10px;border-radius:3px;background:var(--blaze)}
    .brandline span{font-weight:700;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ebony)}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:34px 30px 30px;
      box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px -12px rgba(16,24,40,.12);
    }
    .eyebrow{
      font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
      color:var(--blaze);margin-bottom:10px;
    }
    h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-bottom:8px}
    .sub{color:var(--muted);font-size:.94rem;margin-bottom:24px}
    label{display:block;font-size:.82rem;font-weight:600;color:var(--ebony);margin-bottom:7px}
    input[type=email]{
      width:100%;padding:13px 14px;font-size:.98rem;font-family:inherit;
      border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
      transition:border-color .15s,box-shadow .15s;
    }
    input[type=email]:focus{
      outline:none;border-color:var(--blaze);
      box-shadow:0 0 0 3px rgba(255,105,0,.14);
    }
    button{
      width:100%;margin-top:20px;padding:13px 16px;
      font-family:inherit;font-size:.98rem;font-weight:700;
      color:#fff;background:var(--blaze);border:none;border-radius:10px;
      cursor:pointer;transition:filter .15s,transform .02s;
    }
    button:hover{filter:brightness(.94)}
    button:active{transform:translateY(1px)}
    button:disabled{opacity:.6;cursor:not-allowed;filter:none}
    .msg{
      margin-top:18px;padding:12px 14px;border-radius:10px;font-size:.9rem;
      display:none;
    }
    .msg.show{display:block}
    .msg.ok{background:#ecfdf5;color:var(--aqua);border:1px solid #a7f3d0}
    .msg.bad{background:var(--err-bg);color:var(--err);border:1px solid #fecaca}
    .foot{margin-top:24px;text-align:center;font-size:.9rem;color:var(--muted)}
    .foot a{color:var(--aqua);font-weight:600;text-decoration:none}
    .foot a:hover{text-decoration:underline}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="brandline"><span class="dot"></span><span>TRUSCREN TECH HUB</span></div>
    <div class="card">
      <div class="eyebrow">Account help</div>
      <h1>Reset your password</h1>
      <p class="sub">Enter the email you use to sign in. If it matches an account, we'll send a link to set a new password.</p>

      <label for="email">Email address</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@example.com" />

      <button id="sendBtn">Send reset link</button>

      <div class="msg" id="msg"></div>

      <div class="foot"><a href="/index.html">Back to sign in</a></div>
    </div>
  </div>

  <!-- Supabase JS (same CDN pattern used across the site) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Inline client — matches the per-page pattern used everywhere else on the site.
    const SUPA_URL = 'https://dudbrvrbzpgzjqngvjim.supabase.co';
    const SUPA_KEY = 'sb_publishable_1xkP8W5Ss0Bb3PoFmt4lMA_uyjSMY19';
    const { createClient } = supabase;
    const sb = window.__truscrenSb || createClient(SUPA_URL, SUPA_KEY);
    window.__truscrenSb = sb;

    // Where the emailed link sends people back to. MUST be whitelisted in
    // Supabase → Authentication → URL Configuration → Redirect URLs.
    const RESET_REDIRECT = 'https://truscrenafrica.com/reset-password.html';

    const emailEl = document.getElementById('email');
    const btn = document.getElementById('sendBtn');
    const msg = document.getElementById('msg');

    function show(kind, text){
      msg.className = 'msg show ' + kind;
      msg.textContent = text;
    }

    async function sendReset(){
      const email = emailEl.value.trim();
      if(!email || !email.includes('@')){
        show('bad', 'Please enter a valid email address.');
        emailEl.focus();
        return;
      }
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'Sending…';
      try{
        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: RESET_REDIRECT
        });
        // Deliberately show the SAME message whether or not the email exists,
        // so nobody can use this page to discover which emails are registered.
        if(error && error.status && error.status >= 500){
          show('bad', 'Something went wrong on our side. Please try again in a moment.');
        }else{
          show('ok', 'If that email is registered, a reset link is on its way. Check your inbox (and spam).');
          emailEl.value = '';
        }
      }catch(e){
        show('bad', 'Could not reach the server. Check your connection and try again.');
      }finally{
        btn.disabled = false;
        btn.textContent = original;
      }
    }

    btn.addEventListener('click', sendReset);
    emailEl.addEventListener('keydown', e => { if(e.key === 'Enter') sendReset(); });
  </script>
</body>
</html>
