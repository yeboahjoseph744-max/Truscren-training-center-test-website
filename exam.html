<html lang="en">
<head>

  <title>Certification Exam — TRUSCREN TECH HUB</title>
  <meta name="description" content="Micro-Soldering certification exam.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --blaze:#FF6900; --aqua:#007A5E; --ebony:#262E3D;
      --ink:#1a1f29; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f7f9; --card:#fff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);
      min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;padding:24px;}
    .wrap{max-width:760px;margin:0 auto;}
    .top{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px 0 22px;}
    .top img{width:76px;height:76px;object-fit:contain}
    .top span{font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ebony)}

    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
      padding:30px 28px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px -14px rgba(16,24,40,.12);}

    h1{font-size:1.55rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
    .sub{color:var(--muted);font-size:.95rem;margin-bottom:22px}

    /* progress */
    .progress{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden;margin-bottom:6px}
    .progress > div{height:100%;background:var(--blaze);width:0;transition:width .25s}
    .pmeta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:22px}

    .qtext{font-size:1.15rem;font-weight:700;margin-bottom:18px;line-height:1.4}
    .opts{display:flex;flex-direction:column;gap:10px}
    .opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);
      border-radius:11px;cursor:pointer;transition:border-color .12s,background .12s;background:#fff;
      font-size:1rem;text-align:left;font-family:inherit;color:var(--ink);width:100%}
    .opt:hover{border-color:#cfd4db}
    .opt .box{width:22px;height:22px;border:2px solid #c7ccd4;border-radius:50%;flex:0 0 auto;
      display:flex;align-items:center;justify-content:center;transition:border-color .12s}
    .opt.sel{border-color:var(--blaze);background:#fff7f0}
    .opt.sel .box{border-color:var(--blaze)}
    .opt.sel .box::after{content:'';width:11px;height:11px;border-radius:50%;background:var(--blaze)}
    .opt .ltr{font-weight:700;color:var(--muted);flex:0 0 auto;width:16px}

    .nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
    button.primary{padding:12px 22px;font-family:inherit;font-size:1rem;font-weight:700;color:#fff;
      background:var(--blaze);border:none;border-radius:10px;cursor:pointer;transition:filter .12s}
    button.primary:hover{filter:brightness(.94)}
    button.primary:disabled{opacity:.5;cursor:not-allowed;filter:none}
    button.ghost{padding:12px 18px;font-family:inherit;font-size:1rem;font-weight:600;color:var(--muted);
      background:none;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
    button.ghost:disabled{opacity:.4;cursor:not-allowed}

    /* states */
    .center{text-align:center;padding:20px 0}
    .spin{width:34px;height:34px;border:3px solid #e5e7eb;border-top-color:var(--blaze);
      border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
    @keyframes sp{to{transform:rotate(360deg)}}

    .result-badge{width:96px;height:96px;border-radius:50%;margin:6px auto 16px;
      display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff}
    .pass .result-badge{background:var(--aqua)}
    .fail .result-badge{background:var(--blaze)}
    .result-score{font-size:2.2rem;font-weight:800;margin:2px 0}
    .result-title{font-size:1.35rem;font-weight:800;margin-bottom:6px}
    .result-msg{color:var(--muted);font-size:.98rem;max-width:440px;margin:0 auto 22px}
    .wait{background:#FFF4EC;border-left:4px solid var(--blaze);padding:10px 14px;border-radius:0 6px 6px 0;
      font-size:.9rem;color:#8a4b1f;margin:0 auto 20px;max-width:440px;text-align:left}

    a.link{color:var(--aqua);font-weight:600;text-decoration:none}
    a.link:hover{text-decoration:underline}
    .err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:12px 14px;border-radius:10px;
      font-size:.92rem;margin-top:16px;display:none}
    .err.show{display:block}
  </style>
</head>

      <span>TRUSCREN TECH HUB</span>
    </div>
    <div class="card" id="card">
      <!-- states injected by JS -->
      <div class="center"><div class="spin"></div><p style="color:var(--muted)">Loading exam…</p></div>
    </div>
    <div class="err" id="err"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPA_URL = 'https://dudbrvrbzpgzjqngvjim.supabase.co';
    const SUPA_KEY = 'sb_publishable_1xkP8W5Ss0Bb3PoFmt4lMA_uyjSMY19';
    const { createClient } = supabase;
    const sb = window.__truscrenSb || createClient(SUPA_URL, SUPA_KEY);
    window.__truscrenSb = sb;

    const COURSE = 'micro-soldering';
    const RETRY_WAIT_SECONDS = 30;

    const card = document.getElementById('card');
    const errEl = document.getElementById('err');
    function showErr(m){ errEl.textContent = m; errEl.classList.add('show'); }
    function clearErr(){ errEl.classList.remove('show'); errEl.textContent=''; }

    let questions = [];
    let answers = {};      // position(string) -> chosen index
    let idx = 0;           // current question index (0-based)

    async function init(){
      // must be signed in
      const { data: { session } } = await sb.auth.getSession();
      if(!session){
        card.innerHTML = `<h1>Please sign in</h1>
          <p class="sub">You need to be signed in to take the certification exam.</p>
          <a class="primary" href="/index.html" style="display:inline-block;text-decoration:none;padding:12px 22px;border-radius:10px;color:#fff;background:var(--blaze);font-weight:700">Go to sign in</a>`;
        return;
      }

      // already passed?
      const { data: prior } = await sb.from('exam_results')
        .select('passed,score,total').eq('course_slug', COURSE).maybeSingle();
      if(prior && prior.passed){
        renderAlreadyPassed(prior);
        return;
      }

      // load questions (no answer column returned to the client)
      const { data, error } = await sb.from('exam_questions')
        .select('position,question,options')
        .eq('course_slug', COURSE)
        .order('position', { ascending: true });
      if(error || !data || !data.length){
        card.innerHTML = `<h1>Exam unavailable</h1><p class="sub">Couldn't load the questions. Please try again later.</p>`;
        return;
      }
      questions = data;
      idx = 0; answers = {};
      renderIntro();
    }

    function renderIntro(){
      card.innerHTML = `
        <h1>Certification Exam</h1>
        <p class="sub">Micro-Soldering — Circuit Board</p>
        <p style="margin-bottom:14px">This exam has <strong>${questions.length} multiple-choice questions</strong>.
          You need <strong>80%</strong> to pass and unlock the remaining lessons. You can retake it if you don't pass.</p>
        <button class="primary" id="startBtn">Start Exam →</button>`;
      document.getElementById('startBtn').addEventListener('click', ()=>{ idx=0; renderQuestion(); });
    }

    function renderQuestion(){
      const q = questions[idx];
      const total = questions.length;
      const pct = Math.round((idx)/total*100);
      const letters = ['A','B','C','D','E','F'];
      const opts = q.options.map((o,i)=>{
        const sel = answers[q.position] === i ? 'sel' : '';
        return `<button class="opt ${sel}" data-i="${i}">
          <span class="box"></span><span class="ltr">${letters[i]}</span><span>${o}</span></button>`;
      }).join('');
      card.innerHTML = `
        <div class="progress"><div style="width:${pct}%"></div></div>
        <div class="pmeta"><span>Question ${idx+1} of ${total}</span><span>${Object.keys(answers).length} answered</span></div>
        <div class="qtext">${q.question}</div>
        <div class="opts">${opts}</div>
        <div class="nav">
          <button class="ghost" id="prevBtn" ${idx===0?'disabled':''}>← Back</button>
          <button class="primary" id="nextBtn" ${answers[q.position]===undefined?'disabled':''}>
            ${idx===total-1?'Submit Exam':'Next →'}</button>
        </div>`;
      card.querySelectorAll('.opt').forEach(b=>{
        b.addEventListener('click', ()=>{
          answers[q.position] = parseInt(b.dataset.i,10);
          renderQuestion(); // re-render to show selection + enable Next
        });
      });
      document.getElementById('prevBtn').addEventListener('click', ()=>{ if(idx>0){idx--; renderQuestion();} });
      document.getElementById('nextBtn').addEventListener('click', ()=>{
        if(idx < total-1){ idx++; renderQuestion(); }
        else submit();
      });
    }

    async function submit(){
      clearErr();
      // ensure all answered
      const unanswered = questions.filter(q => answers[q.position] === undefined);
      if(unanswered.length){
        idx = questions.findIndex(q => q.position === unanswered[0].position);
        renderQuestion();
        showErr(`Please answer all questions — ${unanswered.length} still unanswered.`);
        return;
      }
      card.innerHTML = `<div class="center"><div class="spin"></div><p style="color:var(--muted)">Grading your exam…</p></div>`;
      const { data, error } = await sb.rpc('grade_exam', { p_course_slug: COURSE, p_answers: answers });
      if(error){
        showErr('Something went wrong grading the exam. Please try again.');
        renderIntro();
        return;
      }
      const res = Array.isArray(data) ? data[0] : data;
      renderResult(res.score, res.total, res.passed);
    }

    function renderResult(score, total, passed){
      if(passed){
        card.className = 'card pass';
        card.innerHTML = `
          <div class="center">
            <div class="result-badge">✓</div>
            <div class="result-title">You passed!</div>
            <div class="result-score">${score} / ${total}</div>
            <p class="result-msg">Congratulations — you've unlocked the rest of the course. All remaining lessons are now available.</p>
            <a class="primary" href="/learn.html" style="display:inline-block;text-decoration:none;padding:12px 24px;border-radius:10px;color:#fff;background:var(--aqua);font-weight:700">Continue the course →</a>
            <div style="margin-top:30px;padding-top:24px;border-top:1px solid var(--line)">
              <p style="font-size:1rem;font-weight:700;color:var(--ink);margin-bottom:6px">Enjoying TRUSCREN TECH HUB?</p>
              <p style="font-size:.92rem;color:var(--muted);max-width:420px;margin:0 auto 16px">If the training has helped you, we'd be grateful if you shared your experience. It only takes a minute and helps other learners find us.</p>
              <a href="https://www.trustpilot.com/review/www.truscrenafrica.com" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;padding:11px 22px;border-radius:10px;color:#fff;background:var(--blaze);font-weight:700;font-size:.95rem">★ Review us on Trustpilot</a>
            </div>
          </div>`;
      }else{
        card.className = 'card fail';
        const need = Math.ceil(total*0.8);
        card.innerHTML = `
          <div class="center">
            <div class="result-badge">↺</div>
            <div class="result-title">Not quite yet</div>
            <div class="result-score">${score} / ${total}</div>
            <p class="result-msg">You need ${need} correct to pass. Review the lessons and try again — you've got this.</p>
            <div class="wait" id="wait">You can retake the exam in <strong><span id="cd">${RETRY_WAIT_SECONDS}</span> seconds</strong>.</div>
            <button class="primary" id="retryBtn" disabled style="opacity:.5">Retake exam</button>
          </div>`;
        let left = RETRY_WAIT_SECONDS;
        const cd = document.getElementById('cd');
        const btn = document.getElementById('retryBtn');
        const t = setInterval(()=>{
          left--; if(cd) cd.textContent = left;
          if(left<=0){
            clearInterval(t);
            document.getElementById('wait').style.display='none';
            btn.disabled=false; btn.style.opacity='1';
          }
        },1000);
        btn.addEventListener('click', ()=>{ card.className='card'; idx=0; answers={}; renderQuestion(); });
      }
    }

    function renderAlreadyPassed(prior){
      card.className='card pass';
      card.innerHTML = `
        <div class="center">
          <div class="result-badge">✓</div>
          <div class="result-title">Already passed</div>
          <div class="result-score">${prior.score} / ${prior.total}</div>
          <p class="result-msg">You've already passed this exam, so the full course is unlocked.</p>
          <a class="primary" href="/learn.html" style="display:inline-block;text-decoration:none;padding:12px 24px;border-radius:10px;color:#fff;background:var(--aqua);font-weight:700">Go to the course →</a>
        </div>`;
    }

    init().catch(e=>{ showErr('Something went wrong loading the exam.'); });
  </script>
</body>
</html>
